name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public build-time values only; the project has no secrets (docs/security-wa3d-ma.md §5).
env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://wa3d-ma.vercel.app
  NEXT_PUBLIC_REPO_URL: https://github.com/rhorba/wa3d-ma
  NEXT_PUBLIC_ARCHIVE_ENABLED: "false"

jobs:
  quality:
    name: Lint, types, format, fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm fitness

  catalogue:
    name: Catalogue (V-1 to V-17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Errors (including the V-16 embargo guard) fail the job; warnings go to the job summary.
      - run: pnpm catalogue:validate
      - run: pnpm catalogue:validate --data-dir tests/fixtures/catalogue/valid

  test:
    name: Unit + integration (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No pnpm cache here: this job never installs (pnpm audit reads the lockfile only), and an
      # empty cache path makes setup-node's post step fail on branches without a cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Scanner images pinned by digest: semgrep 1.176.1, trivy 0.74.0, gitleaks 8.30.1.
      - name: Semgrep (SAST)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
          semgrep scan --config p/owasp-top-ten --config p/typescript --error
          --exclude skills --exclude docs --metrics off
      - name: Trivy (SCA)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --skip-dirs /src/skills --skip-dirs /src/docs /src
      - name: Gitleaks (secrets)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --exit-code 1
      - name: pnpm audit (SCA, critical fails)
        run: pnpm audit --audit-level=critical

  e2e:
    name: Build + E2E (FR/AR, fixtures)
    runs-on: ubuntu-latest
    # Fictional fixture catalogue with the archive enabled: exercises every page state.
    env:
      WA3D_DATA_DIR: tests/fixtures/catalogue/valid
      NEXT_PUBLIC_ARCHIVE_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build | tee build.log
      # SDR-1: fails if any route is dynamic (ƒ).
      - run: pnpm route-check build.log
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  embargo-smoke:
    name: Embargo smoke (archive flag off)
    runs-on: ubuntu-latest
    env:
      WA3D_DATA_DIR: tests/fixtures/catalogue/valid
      NEXT_PUBLIC_ARCHIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e:embargo

  lighthouse:
    name: Lighthouse + JS budget (NFR-1)
    runs-on: ubuntu-latest
    # Same fixture build as e2e: list + detail pages exist in both locales.
    env:
      WA3D_DATA_DIR: tests/fixtures/catalogue/valid
      NEXT_PUBLIC_ARCHIVE_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # List page <= 130 KB gzip, filters island <= 15 KB (from the build manifest).
      - run: pnpm budget
      # lighthouserc.json: 4 URLs x 3 runs, mobile; perf + a11y >= 0.95 (median run), list JS <= 130 KB.
      - run: pnpm lighthouse
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7
          if-no-files-found: ignore
